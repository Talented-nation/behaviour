<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizard's Escape | تسجيل دخول الطلاب</title>

  <!-- استدعاء Tailwind CSS للتنسيق المتجاوب -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- استدعاء خطوط عربية واضحة وعصرية (Cairo & Tajawal) وخط فانتازي للعنوان (Cinzel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Cinzel:wght@700;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    /* إعدادات الخط والخلفية الرئيسية */
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #120b18;
      background-image: url('https://talented-nation.github.io/behaviour/fun/pics/login.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* خط العنوان الإنجليزي الفانتازي */
    .wizard-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.04em;
    }

    /* طبقة تظليل خفيفة لإبراز البطاقة مع الحفاظ على وضوح الساحر والكتاب المضيء */
    .bg-vignette {
      background: radial-gradient(
        circle at center,
        rgba(18, 10, 28, 0.15) 0%,
        rgba(12, 7, 20, 0.58) 100%
      );
    }

    /* بطاقة تسجيل الدخول بتصميم حجري وسحري شبه شفاف ليُظهر تفاصيل الخلفية */
    .magic-card {
      background: linear-gradient(160deg, rgba(28, 16, 42, 0.78) 0%, rgba(19, 12, 28, 0.85) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #f59e0b;
      box-shadow:
        0 0 0 4px rgba(245, 158, 11, 0.18),
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 0 24px rgba(251, 191, 36, 0.12);
    }

    /* إطار الزوايا المزخرف بنمط البكسل الذهبي */
    .pixel-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #fbbf24;
      box-shadow: 0 0 10px #f59e0b;
    }

    /* تنسيق حقول الإدخال */
    .magic-input {
      background-color: rgba(15, 9, 24, 0.85);
      border: 2px solid rgba(245, 158, 11, 0.45);
      color: #fef3c7;
      transition: all 0.25s ease;
    }

    .magic-input::placeholder {
      color: rgba(253, 230, 138, 0.45);
    }

    .magic-input:focus {
      outline: none;
      border-color: #fbbf24;
      background-color: rgba(24, 14, 38, 0.95);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.45);
    }

    /* زر الدخول المتوهج */
    .magic-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
      border: 2px solid #fde68a;
      box-shadow:
        0 4px 0 #78350f,
        0 8px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s ease;
    }

    .magic-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 #78350f,
        0 12px 26px rgba(251, 191, 36, 0.6);
    }

    .magic-btn:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #78350f,
        0 4px 12px rgba(245, 158, 11, 0.4);
    }

    /* جزيئات ضوئية متطايرة مستوحاة من الكتاب السحري والنار */
    .ember {
      position: fixed;
      bottom: -10px;
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100vh) scale(1.3);
        opacity: 0;
      }
    }

    /* حركة نبض خفيفة للأيقونة */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .float-icon {
      animation: gentleFloat 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 relative">

  <!-- طبقة صورة الخلفية الثابتة لضمان التحميل والظهور الكامل في جميع البيئات -->
  <div class="fixed inset-0 -z-20 pointer-events-none select-none overflow-hidden bg-[#120b18]">
    <img
      id="bg-hero-img"
      src="https://talented-nation.github.io/behaviour/fun/pics/login.jpeg"
      alt="خلفية Wizard's Escape السحرية"
      class="w-full h-full object-cover object-center"
      onerror="this.style.display='none'"
    />
  </div>

  <!-- طبقة التظليل المتدرج فوق الصورة -->
  <div class="fixed inset-0 -z-10 bg-vignette pointer-events-none" aria-hidden="true"></div>

  <!-- عنصر الصوت في الخلفية يعمل تلقائياً وبشكل مستمر -->
  <audio id="bg-audio" autoplay loop preload="auto">
    <source src="https://talented-nation.github.io/behaviour/fun/pics/login.mp3" type="audio/mpeg" />
  </audio>

  <!-- حاوية الجزيئات السحرية المتوهجة -->
  <div id="embers-container" aria-hidden="true"></div>

  <!-- الحاوية الرئيسية لبطاقة تسجيل الدخول -->
  <main class="w-full max-w-md z-10 my-auto">
    <div class="magic-card rounded-2xl p-6 sm:p-8 relative">

      <!-- زوايا بكسل ذهبية للزينة -->
      <span class="pixel-corner -top-1.5 -right-1.5 rounded-sm"></span>
      <span class="pixel-corner -top-1.5 -left-1.5 rounded-sm"></span>
      <span class="pixel-corner -bottom-1.5 -right-1.5 rounded-sm"></span>
      <span class="pixel-corner -bottom-1.5 -left-1.5 rounded-sm"></span>

      <!-- ترويسة البطاقة -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-purple-900/40 border-2 border-amber-400 mb-3 shadow-[0_0_24px_rgba(251,191,36,0.45)] float-icon">
          <!-- أيقونة ساحر متوهجة -->
          <span class="text-4xl select-none drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]" role="img" aria-label="ساحر">🧙‍♂️</span>
        </div>

        <h1 dir="ltr" class="wizard-title text-2xl sm:text-3xl font-black text-amber-300 drop-shadow-[0_2px_8px_rgba(0,0,0,0.95)]">
          Wizard's Escape
        </h1>
        <p class="text-amber-100/90 text-sm sm:text-base mt-1.5 font-bold">
          أدخل بياناتك أيها الساحر لتبدء المغامرة
        </p>
      </div>

      <!-- رسالة تنبيه / خطأ مخصصة داخل الواجهة -->
      <div
        id="form-alert"
        role="alert"
        class="hidden mb-4 p-3 rounded-xl bg-red-950/90 border border-red-400 text-red-200 text-sm font-bold text-center"
      ></div>

      <!-- نموذج تسجيل دخول الطالب -->
      <form id="student-login-form" class="space-y-4" novalidate>

        <!-- حقل اسم الطالب -->
        <div>
          <label for="student-name" class="flex items-center gap-2 text-amber-200 font-bold text-sm sm:text-base mb-1.5">
            <span>🧙‍♂️</span>
            <span>اسم الطالب / الطالبة</span>
          </label>
          <input
            type="text"
            id="student-name"
            name="studentName"
            required
            autocomplete="name"
            placeholder="اكتب اسمك الثلاثي هنا..."
            class="magic-input w-full px-4 py-3 rounded-xl text-base font-medium"
          />
        </div>

        <!-- حقل الصف الدراسي (يدعم الاختيار السريع أو الكتابة الحرة) -->
        <div>
          <label for="student-class" class="flex items-center gap-2 text-amber-200 font-bold text-sm sm:text-base mb-1.5">
            <span>🛡️</span>
            <span>الصف الدراسي</span>
          </label>
          <input
            type="text"
            id="student-class"
            name="studentClass"
            list="classes-list"
            required
            placeholder="مثال: الصف الرابع - 1"
            class="magic-input w-full px-4 py-3 rounded-xl text-base font-medium"
          />
          <datalist id="classes-list">
            <option value="الصف الأول الابتدائي"></option>
            <option value="الصف الثاني الابتدائي"></option>
            <option value="الصف الثالث الابتدائي"></option>
            <option value="الصف الرابع الابتدائي"></option>
            <option value="الصف الخامس الابتدائي"></option>
            <option value="الصف السادس الابتدائي"></option>
            <option value="الصف الأول الإعدادي"></option>
            <option value="الصف الثاني الإعدادي"></option>
            <option value="الصف الثالث الإعدادي"></option>
          </datalist>
        </div>

        <!-- حقل اسم المدرسة -->
        <div>
          <label for="school-name" class="flex items-center gap-2 text-amber-200 font-bold text-sm sm:text-base mb-1.5">
            <span>🏰</span>
            <span>اسم المدرسة</span>
          </label>
          <input
            type="text"
            id="school-name"
            name="schoolName"
            required
            placeholder="اكتب اسم مدرستك هنا..."
            class="magic-input w-full px-4 py-3 rounded-xl text-base font-medium"
          />
        </div>

        <!-- زر إرسال النموذج -->
        <div class="pt-3">
          <button
            type="submit"
            id="start-adventure-btn"
            class="magic-btn w-full py-3.5 px-6 rounded-xl text-white font-black text-lg sm:text-xl flex items-center justify-center gap-2 cursor-pointer"
          >
            <span>ابدأ المغامرة</span>
            <span class="text-xl">✨</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // إعداد الصوت في الخلفية ليعمل تلقائياً دون زر إغلاق
      const bgAudio = document.getElementById('bg-audio');
      let isAudioPlaying = false;

      // ضبط مستوى الصوت ليكون مريحاً ومتوازناً في الخلفية
      bgAudio.volume = 0.45;

      // محاولة تشغيل الصوت تلقائياً
      function ensureAudioPlays() {
        if (isAudioPlaying && !bgAudio.paused) return;
        const playPromise = bgAudio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              isAudioPlaying = true;
              removeInteractionListeners();
            })
            .catch(() => {
              // المتصفح ينتظر أول تفاعل من المستخدم لتشغيل الصوت
              isAudioPlaying = false;
            });
        }
      }

      function removeInteractionListeners() {
        document.removeEventListener('click', ensureAudioPlays);
        document.removeEventListener('keydown', ensureAudioPlays);
        document.removeEventListener('touchstart', ensureAudioPlays);
        document.removeEventListener('pointerdown', ensureAudioPlays);
      }

      // محاولة التشغيل الفوري عند تحميل الصفحة
      ensureAudioPlays();

      // ضمان التشغيل التلقائي فور لمس أو نقر أو كتابة الطالب في أي مكان بالصفحة
      document.addEventListener('click', ensureAudioPlays);
      document.addEventListener('keydown', ensureAudioPlays);
      document.addEventListener('touchstart', ensureAudioPlays);
      document.addEventListener('pointerdown', ensureAudioPlays);

      // توليد جزيئات ضوئية متطايرة لإضفاء حيوية على المشهد
      const embersContainer = document.getElementById('embers-container');
      for (let i = 0; i < 18; i++) {
        const ember = document.createElement('span');
        ember.className = 'ember';
        const size = Math.random() * 4 + 2;
        ember.style.width = `${size}px`;
        ember.style.height = `${size}px`;
        ember.style.left = `${Math.random() * 100}%`;
        ember.style.backgroundColor = Math.random() > 0.3 ? '#fbbf24' : '#f97316';
        ember.style.boxShadow = '0 0 8px #f59e0b';
        ember.style.animationDuration = `${Math.random() * 6 + 5}s`;
        ember.style.animationDelay = `${Math.random() * 5}s`;
        embersContainer.appendChild(ember);
      }

      // عناصر النموذج
      const loginForm = document.getElementById('student-login-form');
      const nameInput = document.getElementById('student-name');
      const classInput = document.getElementById('student-class');
      const schoolInput = document.getElementById('school-name');
      const formAlert = document.getElementById('form-alert');
      const startBtn = document.getElementById('start-adventure-btn');

      // استرجاع بيانات الطالب المحفوظة مسبقاً إن وجدت
      try {
        const savedData = JSON.parse(localStorage.getItem('studentLoginData'));
        if (savedData) {
          if (savedData.studentName) nameInput.value = savedData.studentName;
          if (savedData.studentClass) classInput.value = savedData.studentClass;
          if (savedData.schoolName) schoolInput.value = savedData.schoolName;
        }
      } catch (err) {
        console.warn('تعذر قراءة البيانات المحفوظة:', err);
      }

      // دالة إظهار رسالة خطأ داخل النموذج
      function showAlert(message) {
        formAlert.textContent = message;
        formAlert.classList.remove('hidden');
      }

      function hideAlert() {
        formAlert.classList.add('hidden');
      }

      // معالجة إرسال نموذج تسجيل الدخول والتوجيه المباشر لصفحة الممر
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlert();

        const studentName = nameInput.value.trim();
        const studentClass = classInput.value.trim();
        const schoolName = schoolInput.value.trim();

        // التحقق من إدخال جميع الحقول المطلوبة
        if (!studentName) {
          showAlert('⚠️ يرجى كتابة اسم الطالب / الطالبة أولاً.');
          nameInput.focus();
          return;
        }
        if (!studentClass) {
          showAlert('⚠️ يرجى إدخال أو اختيار الصف الدراسي.');
          classInput.focus();
          return;
        }
        if (!schoolName) {
          showAlert('⚠️ يرجى كتابة اسم المدرسة.');
          schoolInput.focus();
          return;
        }

        // حفظ البيانات في localStorage لاستخدامها في صفحة الممر والألعاب التالية
        const studentData = {
          studentName,
          studentClass,
          schoolName,
          loginTime: new Date().toISOString()
        };

        try {
          localStorage.setItem('studentLoginData', JSON.stringify(studentData));
        } catch (err) {
          console.warn('تعذر حفظ البيانات في التخزين المحلي:', err);
        }

        // إرسال بيانات الطالب إلى صفحة الماستر (إن كانت مضمنة داخل iframe)
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'LOGIN_DATA',
              studentName,
              grade: studentClass,
              schoolName
            }, '*');
          }
        } catch (err) {
          console.warn('تعذر إرسال البيانات إلى الصفحة الرئيسية:', err);
        }

        // إطلاق حدث مخصص يمكن ربطه بأي سكربت خارجي
        window.dispatchEvent(new CustomEvent('studentLoggedIn', { detail: studentData }));

        // تحديث حالة الزر والتوجيه مباشرة إلى صفحة الممر (hallway.html)
        startBtn.innerHTML = '<span>جاري الدخول إلى المغامرة...</span><span class="text-xl">✨</span>';
        startBtn.disabled = true;

        window.location.href = 'https://talented-nation.github.io/behaviour/fun/hallway.html';
      });
    });
  </script>
</body>
</html>
